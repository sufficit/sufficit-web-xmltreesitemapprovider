name: Publish Packages

on:
  push:
    branches: [ main ]    
  # Permite rodar so a verificacao de Trusted Publishing
  # (job verify-auth) sem publicar nada.
  workflow_dispatch:

jobs:
  # Sonda de Trusted Publishing: so roda em workflow_dispatch e NAO publica
  # nada. Serve para descobrir se existe policy registrada no nuget.org para
  # (owner=sufficit, este repositorio, workflow=publish.yml). Sem policy, o
  # passo NuGet/login falha com HTTP 401 - e esse exatamente o sinal buscado.
  verify-auth:
    if: github.event_name == 'workflow_dispatch'
    # Sonda nao compila nada (so troca token OIDC): roda em runner hosted
    # Linux. O job publish segue no windows-2019 original.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify NuGet policy creator is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          test -n "$NUGET_USER" || { echo "Set Actions variable NUGET_USER to the NuGet username that created the trust policy (not the package owner)." >&2; exit 1; }
      - name: Authenticate with NuGet using GitHub OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Verify temporary credential was issued
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: test -n "$NUGET_API_KEY"

  publish:
    # Em workflow_dispatch roda apenas a sonda acima; publicacao
    # continua exclusivamente no push para main.
    if: github.event_name == 'push'
    runs-on: [windows-2019]
    strategy:
      matrix:
        dotnet-versions: [ '4.6.1' ]
    
    env:
      SRC_DIR: ./src
      NUPKGS_DIR: ${{ github.workspace }}/src/nupkgs
        
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Environment
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'
        
    - name: Install dependencies
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet restore
      
    - name: Build
      working-directory: ${{ env.SRC_DIR }}
      run: |
        "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe -property:Configuration=Release"
      
    - name: Deploy Package 
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet pack --configuration Release --output ${{ env.NUPKGS_DIR }}
    
    - name: Publish to Nuget.Org
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet nuget push --skip-duplicate ${{ env.NUPKGS_DIR }}/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{secrets.NUGET_API_KEY}}
      
    # GitHub Packages disabled - only NuGet.org is used
    # - name: Publish to GitHub
    # working-directory: ${{ env.SRC_DIR }}
    # run: dotnet nuget push --skip-duplicate ${{ env.NUPKGS_DIR }}/*.nupkg --source https://nuget.pkg.github.com/${{github.repository_owner}}/index.json --api-key ${{github.token}}
    # # The 'continue-on-error: true' ensures that if this step fails (e.g., due to quota limits),
    # # the overall workflow will still succeed, allowing other steps/jobs to complete.
    # # This makes the GitHub package publishing optional in terms of workflow success.
    # continue-on-error: ${{ env.GITHUBPACKAGEISREQUIRED != 'true' }}
     
